aid: caribou
name: Caribou
description: 'Caribou is a Denver-based fintech that helps drivers lower their monthly car payments by
  refinancing existing auto loans through a network of banks, credit unions, and community lenders.
  Customers check personalized rates with a soft credit pull (no score impact), compare offers, add
  co-borrowers, and complete refinancing online, and can bundle optional vehicle protection plans.
  Caribou reports 150,000+ customers and average savings of about $162/month. The company exposes a
  consumer web application and a contact-gated partner integration program (click-out and API options
  for affiliates); it does not publish a public developer portal, OpenAPI, or self-serve API at this time.'
